name: 'Setup Code Quality Tools'
description: 'Install and cache Python quality tools (Ruff, MyPy, etc.)'
inputs:
  python-version:
    description: 'Python version to use'
    required: true
    default: '3.12'
outputs:
  cache-hit:
    description: 'Whether quality tools were restored from cache'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Cache quality tools
      id: cache
      uses: actions/cache@v5
      with:
        path: ~/.local/bin
        key: quality-tools-${{ inputs.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          quality-tools-${{ inputs.python-version }}-
          quality-tools-
    
    - name: Install quality tools
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install ruff==0.15.5 mypy==1.17.1 isort bandit
        echo "✅ Quality tools installed and cached"