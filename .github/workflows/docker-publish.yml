name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Rebuild weekly to get security updates
    - cron: "0 2 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: docdyhr/simplenote-mcp-server

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      has-docker-secrets: ${{ steps.check.outputs.has-docker-secrets }}
    steps:
      - name: Check Docker Hub secrets
        id: check
        run: |
          if [[ -n "${{ secrets.DOCKER_USERNAME }}" && -n "${{ secrets.DOCKER_TOKEN }}" ]]; then
            echo "has-docker-secrets=true" >> $GITHUB_OUTPUT
            echo "✅ Docker Hub secrets are available"
          else
            echo "has-docker-secrets=false" >> $GITHUB_OUTPUT
            echo "⚠️ Docker Hub secrets are not available - will skip Docker Hub operations"
          fi

  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test] || pip install -e . || echo "Package installation failed, continuing..."
          pip install requests tomli || echo "Additional dependencies failed, continuing..."

      - name: Run linting
        continue-on-error: true
        run: |
          ruff check . || echo "Ruff linting failed"
          ruff format --check . || echo "Ruff format check failed"

      - name: Run security scanning
        continue-on-error: true
        run: |
          bandit -r simplenote_mcp -c .bandit -f json -o bandit-report.json --exit-zero || echo "Bandit scan failed"
          bandit -r simplenote_mcp -c .bandit -f txt --exit-zero || echo "Bandit text output failed"

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: bandit-security-report
          path: bandit-report.json

      - name: Run type checking
        continue-on-error: true
        run: |
          mypy simplenote_mcp --config-file=mypy.ini || echo "MyPy type checking failed"

      - name: Run tests
        continue-on-error: true
        run: |
          pytest tests/ --cov=simplenote_mcp --cov-report=xml -k "not (integration or real_api or network)" || echo "Tests failed"
        env:
          SIMPLENOTE_EMAIL: "test@example.com"
          SIMPLENOTE_PASSWORD: "test_password"
          SIMPLENOTE_OFFLINE_MODE: "true"
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  build-and-push:
    needs: [check-secrets, lint-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
      attestations: write
      id-token: write
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        continue-on-error: true
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        continue-on-error: true
        with:
          version: latest
          platforms: linux/amd64,linux/arm64

      - name: Verify Docker setup
        run: |
          docker version
          docker buildx version
          docker buildx ls

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && needs.check-secrets.outputs.has-docker-secrets == 'true'
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{date 'YYYYMMDD'}}-
            type=schedule,pattern={{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        continue-on-error: true
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
          cache-to: |
            type=gha,mode=max
          provenance: false
          sbom: false
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ github.sha }}

      - name: Fallback single-platform build
        if: failure() && steps.build.outcome == 'failure'
        id: fallback-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && needs.check-secrets.outputs.has-docker-secrets == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Generate attestation for Docker Hub
        uses: actions/attest-build-provenance@v3
        if: github.event_name != 'pull_request' && needs.check-secrets.outputs.has-docker-secrets == 'true'
        continue-on-error: true
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate attestation for GHCR
        uses: actions/attest-build-provenance@v3
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        if: github.event_name != 'pull_request' && (steps.build.outcome == 'success' || steps.fallback-build.outcome == 'success')
        continue-on-error: true
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.2.4"

      - name: Sign container images
        if: github.event_name != 'pull_request' && (steps.build.outcome == 'success' || steps.fallback-build.outcome == 'success')
        continue-on-error: true
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          # Get the digest from successful build
          DIGEST="${{ steps.build.outputs.digest || steps.fallback-build.outputs.digest }}"
          if [ -n "$DIGEST" ]; then
            echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
              echo "Signing $tag"
              cosign sign --yes "$tag@$DIGEST" || echo "Failed to sign $tag"
            done
          else
            echo "No digest available for signing"
          fi

      - name: Verify container signatures
        if: github.event_name != 'pull_request' && (steps.build.outcome == 'success' || steps.fallback-build.outcome == 'success')
        continue-on-error: true
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          # Get the digest from successful build
          DIGEST="${{ steps.build.outputs.digest || steps.fallback-build.outputs.digest }}"
          if [ -n "$DIGEST" ]; then
            echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
              echo "Verifying $tag"
              cosign verify "$tag@$DIGEST" || echo "Verification failed for $tag"
            done
          else
            echo "No digest available for verification"
          fi

  test-image:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    if: github.event_name != 'pull_request' && (needs.build-and-push.result == 'success' || needs.build-and-push.outputs.fallback == 'true')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test Docker image functionality
        continue-on-error: true
        run: |
          # Get the image tag to test
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          # Test that the container starts and shows help
          echo "Testing help command..."
          timeout 60 docker run --rm --pull=always "$IMAGE_TAG" --help || echo "Help command completed with exit code $?"

          # Test module import
          echo "Testing module import..."
          docker run --rm \
            -e SIMPLENOTE_EMAIL=test@example.com \
            -e SIMPLENOTE_PASSWORD=test123 \
            -e SIMPLENOTE_OFFLINE_MODE=true \
            "$IMAGE_TAG" python -c "import simplenote_mcp.server; print('Module import successful')" || echo "Module test completed with exit code $?"

          # Test console script
          echo "Testing console script..."
          timeout 60 docker run --rm \
            -e SIMPLENOTE_EMAIL=test@example.com \
            -e SIMPLENOTE_PASSWORD=test123 \
            -e SIMPLENOTE_OFFLINE_MODE=true \
            "$IMAGE_TAG" which simplenote-mcp-server || echo "Console script test completed with exit code $?"

      - name: Test Docker Compose configurations
        run: |
          # Create a test environment file
          cat > .env.test << EOF
          SIMPLENOTE_EMAIL=test@example.com
          SIMPLENOTE_PASSWORD=testpassword
          SIMPLENOTE_OFFLINE_MODE=true
          EOF

          # Test main docker-compose configuration
          echo "Testing main docker-compose.yml..."
          docker compose -f docker-compose.yml --env-file .env.test config --quiet || echo "Config test completed with exit code $?"

          # Test build docker-compose configuration
          echo "Testing docker-compose.build.yml..."
          docker compose -f docker-compose.build.yml --env-file .env.test config --quiet || echo "Build config test completed with exit code $?"

          # Test that the service can be started (dry-run)
          echo "Testing service startup (dry-run)..."
          docker compose -f docker-compose.yml --env-file .env.test pull --quiet || echo "Pull completed with exit code $?"

          # Clean up
          rm -f .env.test

  security-scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    timeout-minutes: 15
    if: github.event_name != 'pull_request' && (needs.build-and-push.result == 'success' || needs.build-and-push.outputs.fallback == 'true')

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: 0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-container-scan"

      - name: Upload Trivy filesystem scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: "trivy-fs-results.sarif"
          category: "trivy-filesystem-scan"

      - name: Run Docker Scout
        if: github.event_name != 'pull_request' && needs.check-secrets.outputs.has-docker-secrets == 'true'
        uses: docker/scout-action@v1
        continue-on-error: true
        with:
          command: cves
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          only-severities: critical,high
          write-comment: false

  update-docker-hub-description:
    needs: [build-and-push, check-secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 5
    if: github.event_name != 'pull_request' && needs.check-secrets.outputs.has-docker-secrets == 'true' && (needs.build-and-push.result == 'success' || needs.build-and-push.outputs.fallback == 'true')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update Docker Hub repository description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./DOCKER_README.md
          short-description: "MCP server for Simplenote integration with note management and search capabilities."

  notify:
    permissions:
      contents: read
      actions: read
    needs:
      [
        check-secrets,
        lint-and-test,
        build-and-push,
        test-image,
        security-scan,
        update-docker-hub-description,
      ]
    uses: ./.github/workflows/notifications.yml
    if: always()
    with:
      status: ${{ (needs.lint-and-test.result == 'success' && needs.build-and-push.result == 'success') && 'success' || 'failure' }}
      workflow_name: "Docker CI/CD Pipeline"
      message: "Docker pipeline completed. Lint: ${{ needs.lint-and-test.result }}, Build: ${{ needs.build-and-push.result }}, Test: ${{ needs.test-image.result }}, Security: ${{ needs.security-scan.result }}, README: ${{ needs.update-docker-hub-description.result }}"
      slack_enabled: false
      email_enabled: true
    secrets:
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
