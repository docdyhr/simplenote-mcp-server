name: Formatting Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Allow manual triggering

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.12.0"
  MYPY_VERSION: "1.16.1"

jobs:
  format-check:
    name: Code Formatting & Style Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            .pre-commit-config.yaml

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pre-commit ruff==${{ env.RUFF_VERSION }} mypy==${{ env.MYPY_VERSION }} types-requests types-setuptools types-PyYAML pytest
        timeout-minutes: 5

      - name: ✅ Verify Installation
        run: |
          echo "📦 Verifying tool installations..."
          python --version
          echo "Pre-commit: $(pre-commit --version)"
          echo "Ruff: $(ruff --version)"
          echo "MyPy: $(mypy --version)"
          echo "📦 Testing package import..."
          python -c "import simplenote_mcp; print('✅ Package import successful')"
          echo "✅ All tools verified"

      - name: 🧹 Run pre-commit hooks
        id: pre-commit
        run: |
          echo "🔧 Running pre-commit hooks on all files..."
          rm -rf .mypy_cache || true
          pre-commit run --all-files --show-diff-on-failure
        continue-on-error: true

      - name: 📊 Analyze pre-commit results
        if: always()
        run: |
          if [ "${{ steps.pre-commit.outcome }}" = "success" ]; then
            echo "✅ All pre-commit hooks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some pre-commit hooks failed" >> $GITHUB_STEP_SUMMARY
            echo "See job logs for details on formatting issues" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📊 Generate formatting report
        if: always()
        run: |
          echo "📊 Generating formatting report..."
          echo "# Formatting Check Report" > formatting-report.md
          echo "Generated: $(date)" >> formatting-report.md
          echo "" >> formatting-report.md

          if [ "${{ steps.pre-commit.outcome }}" = "success" ]; then
            echo "## ✅ All checks passed!" >> formatting-report.md
            echo "No formatting issues found." >> formatting-report.md
          else
            echo "## ❌ Issues Found" >> formatting-report.md
            echo "Some formatting issues were detected." >> formatting-report.md
            echo "" >> formatting-report.md
            echo "### To fix these issues locally:" >> formatting-report.md
            echo "\`\`\`bash" >> formatting-report.md
            echo "# Install pre-commit if not already installed" >> formatting-report.md
            echo "pip install pre-commit" >> formatting-report.md
            echo "" >> formatting-report.md
            echo "# Auto-fix most issues" >> formatting-report.md
            echo "ruff check . --fix" >> formatting-report.md
            echo "ruff format ." >> formatting-report.md
            echo "" >> formatting-report.md
            echo "# Run all pre-commit hooks" >> formatting-report.md
            echo "pre-commit run --all-files" >> formatting-report.md
            echo "\`\`\`" >> formatting-report.md
            echo "" >> formatting-report.md
            echo "### Alternative: Let pre-commit auto-fix" >> formatting-report.md
            echo "\`\`\`bash" >> formatting-report.md
            echo "pre-commit run --all-files --hook-stage manual" >> formatting-report.md
            echo "\`\`\`" >> formatting-report.md
          fi

      - name: 📤 Upload formatting report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatting-report
          path: formatting-report.md
          retention-days: 30

  quick-lint:
    name: Quick Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Cache Ruff
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ruff-${{ runner.os }}-${{ env.RUFF_VERSION }}
          restore-keys: |
            ruff-${{ runner.os }}-

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==${{ env.RUFF_VERSION }}
        timeout-minutes: 2

      - name: 🔍 Run Ruff linting
        id: lint
        run: |
          echo "🔍 Running Ruff linting checks..."
          ruff check . --output-format=github
        continue-on-error: true

      - name: 📐 Run Ruff formatting check
        id: format
        run: |
          echo "📐 Checking code formatting..."
          ruff format --check --diff .
        continue-on-error: true

      - name: 📊 Generate quick lint summary
        if: always()
        run: |
          echo "# Quick Lint Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Lint Check: ${{ steps.lint.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Format Check: ${{ steps.format.outcome }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.lint.outcome }}" = "success" ] && [ "${{ steps.format.outcome }}" = "success" ]; then
            echo "✅ All quick checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some issues found - check detailed logs" >> $GITHUB_STEP_SUMMARY
          fi

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Cache MyPy
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .mypy_cache
          key: mypy-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ env.MYPY_VERSION }}-${{ hashFiles('mypy.ini', 'pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ env.MYPY_VERSION }}-
            mypy-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mypy==${{ env.MYPY_VERSION }} types-requests types-setuptools types-PyYAML
        timeout-minutes: 3

      - name: 🔍 Run MyPy type checking
        id: mypy
        run: |
          echo "🔍 Running MyPy type checking..."
          rm -rf .mypy_cache || true
          mypy simplenote_mcp --config-file=mypy.ini --show-error-codes --html-report mypy-report
        continue-on-error: true

      - name: 📊 Upload MyPy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report
          path: mypy-report/
          retention-days: 30

      - name: 📊 Generate type check summary
        if: always()
        run: |
          echo "# Type Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "- MyPy Status: ${{ steps.mypy.outcome }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.mypy.outcome }}" = "success" ]; then
            echo "✅ No type errors found!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Type errors detected - check MyPy report artifact" >> $GITHUB_STEP_SUMMARY
          fi
