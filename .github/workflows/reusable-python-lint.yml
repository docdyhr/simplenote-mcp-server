name: Reusable - Python Lint

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"

jobs:
  lint:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate files
        run: |
          find . -type f -size +1M | grep -v "^./.git" | while read -r file; do
            echo "Warning: Large file detected: $file ($(du -h "$file" | cut -f1))"
          done

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache
        with:
          path: |
            ~/.cache/pip
            ~/.local
            .venv
          key: deps-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            deps-${{ runner.os }}-py${{ inputs.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Check version consistency
        run: python scripts/quality/check_version_consistency.py

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Every file, not just the PR's changes: a local commit only checks the
      # files it touches, so vendored or untouched files could otherwise
      # carry failures until something lints the whole tree.
      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run linters
        run: |
          ruff check .
          ruff format --check .
          mypy simplenote_mcp
