name: Reusable - Python Lint

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"

jobs:
  lint:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate files
        run: |
          find . -type f -size +1M | grep -v "^./.git" | while read -r file; do
            echo "Warning: Large file detected: $file ($(du -h "$file" | cut -f1))"
          done

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache
        with:
          path: |
            ~/.cache/pip
            ~/.local
            .venv
          key: deps-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            deps-${{ runner.os }}-py${{ inputs.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Check version consistency
        run: python scripts/quality/check_version_consistency.py

      - name: Run linters
        run: |
          ruff check .
          ruff format --check .
          mypy simplenote_mcp
