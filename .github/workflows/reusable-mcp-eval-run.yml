# NOTE: deliberately over the repo's usual ~80-line thin-caller target (see
# .github/workflows/AGENTS.md) -- same rationale as reusable-eval-quality-run.yml:
# a single sequential pipeline (Python/Node setup -> installs -> 3 near-identical
# mcp-evals action invocations -> summary) where splitting would duplicate the
# setup+install steps in a second job, netting more total lines, not fewer.
name: Reusable - Run MCP Evaluations

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      node-version:
        type: string
        default: "20"
    secrets:
      OPENAI_API_KEY:
        required: false
    outputs:
      has-openai-key:
        value: ${{ jobs.evaluate.outputs.has-openai-key }}

jobs:
  evaluate:
    name: evaluate-mcp-server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      has-openai-key: ${{ steps.check-openai.outputs.has-openai-key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Setup Node.js for mcp-evals
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ inputs.node-version }}
          # Note: npm cache disabled - package-lock.json may not exist on scheduled runs

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]" || pip install -e . || echo "Package installation failed"

      - name: Install mcp-evals
        continue-on-error: true
        run: |
          npm init -y
          npm install mcp-evals || echo "mcp-evals installation failed"

      - name: Prepare test environment
        run: |
          {
            echo "SIMPLENOTE_EMAIL=test@example.com"
            echo "SIMPLENOTE_PASSWORD=test_password"
            echo "SIMPLENOTE_OFFLINE_MODE=true"
          } >> .env.test
          python -c "import simplenote_mcp.server; print('✅ Server module import successful')" || echo "⚠️ Server import failed"

      - name: Check OpenAI API key availability
        id: check-openai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: scripts/ci/check_openai_api_key.sh

      - name: Run smoke tests
        if: steps.check-openai.outputs.has-openai-key == 'true'
        uses: mclenhard/mcp-evals@614087def55f3b68258580b05f0ae3a7d55207b4 # v1.0.14
        timeout-minutes: 10
        with:
          evals_path: "evals/smoke-tests.yaml"
          server_path: "simplenote_mcp_server.py"
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          model: "gpt-4o-mini"
        continue-on-error: true

      - name: Run manual smoke tests (fallback)
        if: steps.check-openai.outputs.has-openai-key == 'false'
        run: |
          echo "🧪 Running manual smoke tests without OpenAI..."
          timeout 30 python simplenote_mcp_server.py --help || echo "Server help command failed"
          python scripts/ci/manual_smoke_test.py || echo "Manual tests completed with errors"

      - name: Run comprehensive evaluations
        if: (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'comprehensive-eval')) && steps.check-openai.outputs.has-openai-key == 'true'
        uses: mclenhard/mcp-evals@614087def55f3b68258580b05f0ae3a7d55207b4 # v1.0.14
        with:
          evals_path: "evals/comprehensive-evals.yaml"
          server_path: "simplenote_mcp_server.py"
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          model: "gpt-4o"
        continue-on-error: true

      - name: Run basic evaluations
        if: github.event_name != 'workflow_dispatch' && steps.check-openai.outputs.has-openai-key == 'true'
        uses: mclenhard/mcp-evals@614087def55f3b68258580b05f0ae3a7d55207b4 # v1.0.14
        with:
          evals_path: "evals/simplenote-evals.yaml"
          server_path: "simplenote_mcp_server.py"
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          model: "gpt-4o-mini"
        continue-on-error: true

      - name: Generate evaluation summary
        if: always()
        env:
          HAS_OPENAI_KEY: ${{ steps.check-openai.outputs.has-openai-key }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: scripts/ci/generate_eval_summary.sh

      - name: Upload evaluation summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evaluation-summary
          path: evaluation-summary.md
          retention-days: 30
