name: Reusable - Sync Version References

on:
  workflow_call:
    inputs:
      version:
        description: "Bare semver version, e.g. 1.17.5"
        required: true
        type: string
      tag:
        description: "Git tag, e.g. v1.17.5"
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync version references
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: scripts/release/sync_version_references.sh "$VERSION" "$TAG"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            git diff --name-only
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            docs: Update version references to ${{ inputs.tag }}

            🤖 Generated with [Claude Code](https://claude.ai/code)

            Co-Authored-By: Claude <noreply@anthropic.com>
          title: "📝 Update version references to ${{ inputs.tag }}"
          body: |
            Automated version reference sync following release of `${{ inputs.tag }}`.

            - README.md version badge + example tag
            - Helm Chart.yaml `version`/`appVersion`
            - Helm values.yaml default image tag
            - docs/DOCKER_CI_CD_SETUP.md (if present)

            🤖 Generated by the version-sync workflow.
          branch: update-version-${{ inputs.tag }}
          base: main
          labels: |
            documentation
            automated
            version-update
          reviewers: docdyhr
          assignees: docdyhr

      - name: Log results
        run: echo "${{ steps.changes.outputs.has_changes == 'true' && '✅ Version update PR created' || 'ℹ️ No version references needed updating' }} for ${{ inputs.tag }}"
