name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 3 * * 1" # Weekly on Monday at 3 AM UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-scan:
    name: Basic Security Scan
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install bandit safety ruff==0.12.7
        continue-on-error: true

      - name: ✅ Verify Installation
        run: |
          echo "📦 Testing package import..."
          python -c "import simplenote_mcp; print('✅ Package import successful')"
          echo "🔧 Checking security tools..."
          bandit --version
          safety --version
        continue-on-error: false

      - name: Run Bandit security scan
        run: |
          echo "🔒 Running Bandit security scan..."
          bandit -r simplenote_mcp/ || echo "⚠️ Bandit scan completed with issues"
        continue-on-error: true

      - name: Run Safety check
        run: |
          echo "🛡️ Running Safety vulnerability check..."
          safety check || echo "⚠️ Safety check completed with issues"
        continue-on-error: true

      - name: Security scan with ruff
        run: |
          echo "🔍 Running security scan with Ruff..."
          ruff check --select=S . || echo "⚠️ Security linting completed with issues"
        continue-on-error: true

  codeql-analysis:
    timeout-minutes: 8
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
        continue-on-error: true

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
        continue-on-error: true
