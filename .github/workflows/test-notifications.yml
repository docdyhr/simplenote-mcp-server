name: Test Email Notifications

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of notification test'
        required: true
        default: 'success'
        type: choice
        options:
          - success
          - failure
          - cancelled

jobs:
  test-notification:
    uses: ./.github/workflows/notifications.yml
    timeout-minutes: 10
    with:
      status: ${{ inputs.test_type }}
      workflow_name: "Email Notification Test"
      message: "This is a test of the email notification system. Test type: ${{ inputs.test_type }}"
      slack_enabled: false
      email_enabled: true
    secrets:
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}