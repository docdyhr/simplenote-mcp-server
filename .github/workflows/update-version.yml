name: Update Version References

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          # Remove 'v' prefix from tag to get version
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
          echo "Tag: ${GITHUB_REF#refs/tags/}"

      - name: Update README.md version badge
        run: |
          # Update version badge in README.md
          sed -i.bak "s|version-[0-9]*\.[0-9]*\.[0-9]*-blue|version-${{ steps.version.outputs.version }}-blue|g" README.md
          
          # Update example tags in README.md
          sed -i.bak "s|- \`v[0-9]*\.[0-9]*\.[0-9]*\` - Specific version|- \`${{ steps.version.outputs.tag }}\` - Specific version|g" README.md
          
          # Clean up backup files
          rm -f README.md.bak

      - name: Update Helm Chart version
        run: |
          # Update Chart.yaml
          sed -i.bak "s|^version: .*|version: ${{ steps.version.outputs.version }}|g" helm/simplenote-mcp-server/Chart.yaml
          sed -i.bak "s|^appVersion: .*|appVersion: \"${{ steps.version.outputs.version }}\"|g" helm/simplenote-mcp-server/Chart.yaml
          
          # Update values.yaml default tag
          sed -i.bak "s|tag: \".*\"|tag: \"${{ steps.version.outputs.tag }}\"|g" helm/simplenote-mcp-server/values.yaml
          
          # Clean up backup files
          rm -f helm/simplenote-mcp-server/Chart.yaml.bak helm/simplenote-mcp-server/values.yaml.bak

      - name: Update documentation examples
        run: |
          # Update Docker CI/CD setup documentation
          if [ -f "docs/DOCKER_CI_CD_SETUP.md" ]; then
            sed -i.bak "s|docdyhr/simplenote-mcp-server:v[0-9]*\.[0-9]*\.[0-9]*|docdyhr/simplenote-mcp-server:${{ steps.version.outputs.tag }}|g" docs/DOCKER_CI_CD_SETUP.md
            rm -f docs/DOCKER_CI_CD_SETUP.md.bak
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            git diff --name-only
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            docs: Update version references to ${{ steps.version.outputs.tag }}
            
            - Update README.md version badge
            - Update Helm chart version and appVersion
            - Update documentation examples
            
            🤖 Generated with [Claude Code](https://claude.ai/code)
            
            Co-Authored-By: Claude <noreply@anthropic.com>
          title: "📝 Update version references to ${{ steps.version.outputs.tag }}"
          body: |
            ## Summary
            
            This PR automatically updates version references throughout the repository following the release of `${{ steps.version.outputs.tag }}`.
            
            ## Changes
            
            - ✅ **README.md**: Updated version badge and example tags
            - ✅ **Helm Chart**: Updated Chart.yaml version and appVersion
            - ✅ **Helm Values**: Updated default image tag
            - ✅ **Documentation**: Updated version references in examples
            
            ## Verification
            
            - [ ] Version badge displays correctly: ![Version](https://img.shields.io/badge/version-${{ steps.version.outputs.version }}-blue.svg)
            - [ ] Docker examples reference the correct tag: `${{ steps.version.outputs.tag }}`
            - [ ] Helm chart metadata is accurate
            
            ---
            
            🤖 This PR was automatically created by the version update workflow.
          branch: update-version-${{ steps.version.outputs.tag }}
          base: main
          labels: |
            documentation
            automated
            version-update
          reviewers: docdyhr
          assignees: docdyhr

      - name: Log results
        run: |
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ Version update PR created for ${{ steps.version.outputs.tag }}"
            echo "📝 Updated version references in documentation"
          else
            echo "ℹ️ No version references needed updating"
          fi