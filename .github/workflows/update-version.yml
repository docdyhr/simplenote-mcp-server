name: Update Version References

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to sync version references for (e.g. v1.17.5) — manual testing only"
        required: true
        type: string

jobs:
  extract-version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Extract version from tag
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          RAW_TAG="${INPUT_TAG:-$REF_NAME}"
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"

  update-version:
    needs: extract-version
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/reusable-version-sync.yml
    with:
      version: ${{ needs.extract-version.outputs.version }}
      tag: ${{ needs.extract-version.outputs.tag }}
