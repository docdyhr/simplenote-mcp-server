name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Type of version bump to perform"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      pre_release:
        description: "Pre-release label (optional)"
        required: false
        type: string
      dry_run:
        description: "Dry run (no changes will be committed)"
        required: false
        default: false
        type: boolean

jobs:
  prepare-release:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/reusable-release-prepare.yml
    with:
      bump_type: ${{ github.event.inputs.bump_type }}
      pre_release: ${{ github.event.inputs.pre_release }}
      dry_run: ${{ github.event.inputs.dry_run }}

  build-and-publish:
    needs: prepare-release
    if: needs.prepare-release.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-release-build.yml
    with:
      new_version: ${{ needs.prepare-release.outputs.new_version }}

  attach-security-reports:
    needs: [prepare-release, build-and-publish]
    if: needs.prepare-release.outputs.release_created == 'true' && needs.build-and-publish.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-release-attach-reports.yml
    with:
      new_version: ${{ needs.prepare-release.outputs.new_version }}

  notify:
    timeout-minutes: 5
    name: Notification
    needs: [prepare-release, build-and-publish, attach-security-reports]
    if: ${{ always() && needs.prepare-release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Send success notification
        if: ${{ needs.build-and-publish.result == 'success' }}
        run: echo "Version ${{ needs.prepare-release.outputs.new_version }} tagged and built. Run publish-pypi.yml to publish to PyPI."

      - name: Send failure notification
        if: ${{ needs.build-and-publish.result != 'success' }}
        run: echo "Release process failed at the build stage."
