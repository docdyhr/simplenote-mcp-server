name: Eval File Check

# Validates changed evals/*.yaml files and notes them on the PR. The LLM
# evaluations themselves run in evaluation-quality-gate.yml; this workflow's
# former mclenhard/mcp-evals run passed the Python server to mcp-evals, which
# only loads JS/TS, so it never produced a result.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "evals/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate-pr-changes:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/reusable-mcp-eval-pr-check.yml
