name: MCP Evaluations

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "simplenote_mcp/**"
      - "simplenote_mcp_server.py"
      - "evals/**"
      - "pyproject.toml"
  workflow_dispatch: # Allow manual triggering
  schedule:
    # Run weekly to catch issues early
    - cron: "0 2 * * 1" # Mondays at 2 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate-mcp-server:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-mcp-eval-run.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  evaluate-pr-changes:
    if: github.event_name == 'pull_request'
    needs: evaluate-mcp-server
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/reusable-mcp-eval-pr-check.yml
    with:
      has-openai-key: ${{ needs.evaluate-mcp-server.outputs.has-openai-key || 'false' }}
