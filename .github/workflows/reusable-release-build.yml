name: Reusable - Build Release Package

on:
  workflow_call:
    inputs:
      new_version:
        type: string
        required: true

jobs:
  build:
    timeout-minutes: 10
    name: Build Package and Generate Security Reports
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ inputs.new_version }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # No pre-commit here: this job runs after the tag and GitHub Release
      # exist, so a lint failure could only cost the security reports. The
      # Validate job runs `pre-commit run --all-files` on every PR instead.
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      # The reports describe a clean venv holding only the built wheel and its
      # dependencies (pip upgraded, so pip's own advisories don't show up),
      # not this runner's build tools.
      - name: Install the built wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/release-env"
          "$RUNNER_TEMP/release-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/release-env/bin/python" -m pip install dist/*.whl

      # The report script comes from the commit this workflow runs from, not
      # from the release tag: release-finish.yml rebuilds reports for older
      # tags, whose own copy of the script predates fixes like #1005.
      - name: Check out the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: scripts
          persist-credentials: false

      - name: Generate SBOM and vulnerability report
        env:
          NEW_VERSION: ${{ inputs.new_version }}
        run: |
          python release-tools/scripts/generate_release_security_reports.py \
            --version "$NEW_VERSION" \
            --python "$RUNNER_TEMP/release-env/bin/python"

      - name: Upload SBOM and vulnerability artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-reports-${{ inputs.new_version }}
          path: |
            sbom-*.json
            sbom-*.xml
            vulnerability-*.json
            vulnerability-*.md
          retention-days: 90
