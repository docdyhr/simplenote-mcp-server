name: Reusable - Attach Release Security Reports

on:
  workflow_call:
    inputs:
      new_version:
        type: string
        required: true

jobs:
  attach:
    timeout-minutes: 5
    name: Attach Security Reports to Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download security artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: security-reports-${{ inputs.new_version }}
          path: security-reports/

      - name: List downloaded files
        run: |
          echo "📋 Downloaded security reports:"
          ls -la security-reports/

      # gh release upload only touches the assets: release-finish.yml
      # re-attaches reports to existing releases, whose body and "latest"
      # flag must stay as they are. --clobber replaces same-named files.
      - name: Attach SBOM and vulnerability reports to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ inputs.new_version }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            security-reports/sbom-release.json \
            security-reports/sbom-release.xml \
            security-reports/sbom-release-simple.json \
            security-reports/vulnerability-report.json \
            security-reports/vulnerability-report.md \
            security-reports/vulnerability-summary.json
