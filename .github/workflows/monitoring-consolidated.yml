name: Consolidated Monitoring

on:
  schedule:
    # Run all monitoring tasks weekly on Sunday mornings
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      run_security_check:
        description: "Run security monitoring"
        required: false
        default: true
        type: boolean
      run_health_check:
        description: "Run health check"
        required: false
        default: true
        type: boolean
      run_badge_check:
        description: "Run badge validation"
        required: false
        default: true
        type: boolean
      fail_on_security_issues:
        description: "Fail workflow on security issues"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/**"
      - "simplenote_mcp/**"
      - "pyproject.toml"
  release:
    types: [published]

jobs:
  security-monitoring:
    if: github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_security_check == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.modified, 'simplenote_mcp/'))
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-security-scan.yml
    with:
      bandit-confidence: "high"
      upload-artifacts: true
      fail-on-issues: ${{ github.event.inputs.fail_on_security_issues == 'true' }}

  health-monitoring:
    if: github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_health_check == 'true')
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-health-check.yml

  badge-monitoring:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_badge_check == 'true') || (github.event_name == 'push' && contains(github.event.head_commit.modified, 'README.md'))
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-badge-check.yml

  monitoring-summary:
    needs: [security-monitoring, health-monitoring, badge-monitoring]
    if: always()
    uses: ./.github/workflows/reusable-monitoring-summary.yml
    with:
      security-result: ${{ needs.security-monitoring.result }}
      health-result: ${{ needs.health-monitoring.result }}
      badge-result: ${{ needs.badge-monitoring.result }}
