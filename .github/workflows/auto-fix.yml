name: Auto-Fix Common Issues

on:
  workflow_run:
    workflows: ["Unified CI/CD Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to apply auto-fixes"
        required: true
        default: "main"
      fix_types:
        description: "Types of fixes to apply (comma-separated: formatting,imports,trailing-whitespace)"
        required: true
        default: "formatting,imports,trailing-whitespace"

jobs:
  resolve-target:
    # Security: Only run on workflow_dispatch OR when workflow_run is from same repo (not forks)
    # This prevents checking out untrusted code from fork PRs
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       contains(github.event.workflow_run.name, 'CI/CD') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      target_branch: ${{ steps.branch-info.outputs.target_branch }}
      fix_types: ${{ steps.branch-info.outputs.fix_types }}
    steps:
      # Security: both values are validated against an allowlist here, before
      # either is ever passed to a downstream job / interpolated into a shell
      # step (git ls-remote/push).
      - name: Determine and validate target branch
        id: branch-info
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
          INPUT_FIX_TYPES: ${{ github.event.inputs.fix_types }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then TARGET_BRANCH="$INPUT_TARGET_BRANCH"; FIX_TYPES="$INPUT_FIX_TYPES"; else TARGET_BRANCH="$WORKFLOW_RUN_HEAD_BRANCH"; FIX_TYPES="formatting,imports,trailing-whitespace"; fi

          if ! printf '%s' "$TARGET_BRANCH" | grep -qE '^(main|develop|feature/[A-Za-z0-9._/-]+|dependabot/[A-Za-z0-9._/-]+)$'; then echo "::error::Target branch '$TARGET_BRANCH' does not match the allowed branch pattern" >&2; exit 1; fi
          if ! printf '%s' "$FIX_TYPES" | grep -qE '^(formatting|imports|trailing-whitespace)(,(formatting|imports|trailing-whitespace))*$'; then echo "::error::fix_types must be a comma-separated list of: formatting,imports,trailing-whitespace" >&2; exit 1; fi

          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "fix_types=$FIX_TYPES" >> "$GITHUB_OUTPUT"

  auto-fix-apply:
    needs: resolve-target
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/reusable-auto-fix-apply.yml
    with:
      target_branch: ${{ needs.resolve-target.outputs.target_branch }}
      fix_types: ${{ needs.resolve-target.outputs.fix_types }}

  auto-fix-notify:
    needs: [resolve-target, auto-fix-apply]
    if: always() && needs.auto-fix-apply.result != 'skipped'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/reusable-auto-fix-notify.yml
    with:
      target_branch: ${{ needs.resolve-target.outputs.target_branch }}
      fix_types: ${{ needs.resolve-target.outputs.fix_types }}
      branch_exists: ${{ needs.auto-fix-apply.outputs.branch_exists }}
      changes_made: ${{ needs.auto-fix-apply.outputs.changes_made }}
      format_fixes_needed: ${{ needs.auto-fix-apply.outputs.format_fixes_needed }}
      import_fixes: ${{ needs.auto-fix-apply.outputs.import_fixes }}
      whitespace_fixes: ${{ needs.auto-fix-apply.outputs.whitespace_fixes }}
