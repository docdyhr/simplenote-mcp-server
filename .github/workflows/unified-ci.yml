name: Unified CI/CD Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"
  SIMPLENOTE_OFFLINE_MODE: "true"
  TSX_CACHE_DIR: /tmp/tsx-cache
  NODE_OPTIONS: "--max-old-space-size=4096"
  PYTEST_TIMEOUT: "60"
  REGISTRY: docker.io
  IMAGE_NAME: docdyhr/simplenote-mcp-server

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate files
        run: |
          find . -type f -size +1M | grep -v "^./.git" | while read file; do
            echo "Warning: Large file detected: $file ($(du -h "$file" | cut -f1))"
          done

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Cache dependencies
        uses: actions/cache@v6
        id: cache
        with:
          path: |
            ~/.cache/pip
            ~/.local
            .venv
          key: deps-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            deps-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Check version consistency
        run: |
          python scripts/quality/check_version_consistency.py

      - name: Run linters
        run: |
          ruff check .
          ruff format --check .
          mypy simplenote_mcp

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Restore dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.local
            .venv
          key: deps-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run tests
        env:
          SIMPLENOTE_EMAIL: test@example.com
          SIMPLENOTE_PASSWORD: test-password
        run: |
          pytest tests/ --randomly-seed=${{ github.run_id }} --cov=simplenote_mcp --cov-report=xml --cov-report=json --cov-report=term

      - name: Check coverage threshold
        run: |
          python scripts/quality/check_coverage.py --threshold 75.0

      - name: Run legacy test suite (separate process — do not merge into tests/)
        env:
          SIMPLENOTE_EMAIL: test@example.com
          SIMPLENOTE_PASSWORD: test-password
        run: |
          # simplenote_mcp/tests/ and tests/ both exercise process-global
          # singletons (metrics collector, security validator). Each tree
          # resets them for its own tests via an autouse conftest fixture,
          # but that only protects tests within the same tree — collecting
          # both into one `pytest` invocation (one process) lets tests from
          # one tree corrupt the other's state. Keeping this a fully
          # separate `pytest` process (own testpaths, own working memory)
          # sidesteps that; do not add this directory to testpaths above.
          pytest simplenote_mcp/tests/ --randomly-seed=${{ github.run_id }} --no-cov

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: true

  security:
    name: Security
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install bandit pip-audit

      - name: Run security scans
        run: |
          bandit -r simplenote_mcp --severity-level high
          pip install -e .
          # CVE-2026-4539: pygments ReDoS (local-only, no fix available as of 2026-03-28)
          # CVE-2026-3219: affects pip itself (CI runner tool), not a project dependency; no fix available
          # CVE-2026-6357: affects pip itself (CI runner tool); fix is pip>=26.1
          # PYSEC-2026-196: affects pip itself (CI runner tool); path traversal in entry-point install; fix is pip>=26.1.2
          pip-audit --desc --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357 --ignore-vuln PYSEC-2026-196

  build_and_publish:
    name: Build and Publish
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest
          platforms: linux/amd64,linux/arm64

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{date 'YYYYMMDD'}}-
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          trivyignores: ".trivyignore"

      - name: Upload Trivy scan results to GitHub Security tab
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-container-scan"

      - name: Update Docker Hub repository description
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./DOCKER_README.md
          short-description: "MCP server for Simplenote integration with note management and search capabilities."

  local-test:
    name: Local Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"
          pip install build

      - name: Run local test script
        run: |
          ./test-ci-locally.sh

  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [validate, test, security, build_and_publish, local-test]
    if: always()
    steps:
      - name: Check status
        run: |
          if [[ "${{ contains(join(needs.*.result, ','), 'failure') }}" == "true" ]]; then
            echo "❌ CI pipeline failed"
            exit 1
          elif [[ "${{ contains(join(needs.*.result, ','), 'cancelled') }}" == "true" ]]; then
            echo "⚠️ CI pipeline was cancelled"
            exit 1
          else
            echo "✅ CI pipeline passed successfully!"
          fi
