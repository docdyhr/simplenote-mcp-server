name: Unified CI/CD Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-python-lint.yml
    with:
      python-version: "3.13"

  test:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-python-test.yml
    with:
      python-version: "3.13"
      coverage-threshold: "75.0"

  security:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-security-scan.yml
    with:
      python-version: "3.13"
      # CVE-2026-4539: pygments ReDoS (local-only, no fix available as of 2026-03-28)
      # CVE-2026-3219: affects pip itself (CI runner tool), not a project dependency; no fix available
      # CVE-2026-6357: affects pip itself (CI runner tool); fix is pip>=26.1
      # PYSEC-2026-196: affects pip itself (CI runner tool); path traversal in entry-point install; fix is pip>=26.1.2
      pip-audit-ignore-cves: "CVE-2026-4539,CVE-2026-3219,CVE-2026-6357,PYSEC-2026-196"

  build_and_publish:
    needs: [test, security]
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      registry: docker.io
      image-name: docdyhr/simplenote-mcp-server
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  local-test:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-local-test.yml
    with:
      python-version: "3.13"

  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [validate, test, security, build_and_publish, local-test]
    if: always()
    steps:
      - name: Check status
        run: |
          if [[ "${{ contains(join(needs.*.result, ','), 'failure') }}" == "true" ]]; then echo "❌ CI pipeline failed"; exit 1; fi
          if [[ "${{ contains(join(needs.*.result, ','), 'cancelled') }}" == "true" ]]; then echo "⚠️ CI pipeline was cancelled"; exit 1; fi
          echo "✅ CI pipeline passed successfully!"
