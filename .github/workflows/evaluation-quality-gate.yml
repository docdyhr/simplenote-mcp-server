name: Evaluation Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "simplenote_mcp/**"
      - "simplenote_mcp_server.py"
      - "mcp-server-wrapper.ts"
      - "tests/**"
      - "evals/**"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/evaluation-quality-gate.yml"
      - ".github/workflows/reusable-eval-quality-*.yml"
      - ".github/scripts/*quality-gate*.js"
      - "scripts/ci/*eval*"
      - "scripts/ci/check_openai_api_key.sh"
      - "scripts/ci/render_quality_gate_report.sh"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to evaluate (optional)"
        required: false
        type: number
      evaluation_suite:
        description: "Evaluation suite to run"
        required: false
        default: "basic"
        type: choice
        options:
          - smoke
          - basic
          - comprehensive
      fail_threshold:
        description: "Minimum pass rate to fail (0-100)"
        required: false
        default: 70
        type: number

# Each run makes real OpenAI calls; a newer push to the same PR supersedes it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-evaluations:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-eval-quality-run.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    with:
      evaluation-suite: ${{ github.event.inputs.evaluation_suite || 'basic' }}
      fail-threshold: ${{ github.event.inputs.fail_threshold || '70' }}

  quality-gate-assessment:
    needs: run-evaluations
    if: always()
    permissions:
      pull-requests: write
      checks: write
    uses: ./.github/workflows/reusable-eval-quality-report.yml
    with:
      run-result: ${{ needs.run-evaluations.result }}
      pass-rate: ${{ needs.run-evaluations.outputs.pass-rate || '0' }}
      quality-gate-passed: ${{ needs.run-evaluations.outputs.quality-gate-passed || 'false' }}
      status: ${{ needs.run-evaluations.outputs.status || 'unknown' }}
      fail-threshold: ${{ github.event.inputs.fail_threshold || '70' }}
      evaluation-suite: ${{ github.event.inputs.evaluation_suite || 'basic' }}
