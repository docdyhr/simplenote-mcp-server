name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-docs-build.yml

  deploy-docs:
    needs: build-docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/reusable-docs-deploy.yml

  link-check:
    needs: build-docs
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-docs-link-check.yml
