version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
    open-pull-requests-limit: 10
    assignees:
      - "docdyhr"

    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    allow:
      - dependency-type: "all"
    ignore:
      # pydantic_core is pinned exactly by pydantic (pydantic==2.13.4 requires
      # pydantic_core==2.46.4), so a standalone bump is unsatisfiable and fails
      # the Docker build with ResolutionImpossible — see closed PR #811.
      # It moves only when pydantic itself bumps.
      - dependency-name: "pydantic-core"
    groups:
      production-dependencies:
        dependency-type: "production"
        patterns:
          - "mcp*"
          - "simplenote*"
      security-dependencies:
        # A group's `update-types` accepts only major/minor/patch; "security"
        # was invalid and silently prevented this group from applying.
        # Security-only grouping is expressed via `applies-to`.
        applies-to: "security-updates"
        dependency-type: "production"
        patterns:
          - "starlette*"
          - "urllib3*"
          - "requests*"
      development-dependencies:
        dependency-type: "development"
        patterns:
          - "ruff*"
          - "mypy*"
          - "pytest*"
          - "black*"
          - "pre-commit*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "docdyhr"

    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # npm (MCP evaluation tooling — devDependencies only, not shipped)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "docdyhr"

    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 3
    assignees:
      - "docdyhr"

    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
