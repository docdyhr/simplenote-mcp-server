version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
    open-pull-requests-limit: 10
    assignees:
      - "docdyhr"

    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    allow:
      - dependency-type: "all"
    ignore:
      # radon 6.0.1 (latest release) requires mando<0.8, so mando 0.8.x makes
      # requirements-lock.txt unresolvable. Bumped and reverted twice already
      # (#338, #769 -> #858). Drop this once a radon release allows mando>=0.8.
      - dependency-name: "mando"
        versions: [">=0.8"]
    groups:
      # httpx2 pins httpcore2 exactly (httpx2 2.13.1 requires
      # httpcore2==2.13.1), so a standalone bump of either one is
      # unsatisfiable and breaks the Docker build with ResolutionImpossible —
      # happened twice (#840 -> fixed by #842, #896). Move them in one PR.
      httpx2-stack:
        patterns:
          - "httpx2"
          - "httpcore2"
      # Same exact-pin shape: griffe 2.3.0 requires griffecli==2.3.0 and
      # griffelib==2.3.0 (mkdocstrings docs tooling). #914 bumped griffe alone.
      griffe-stack:
        patterns:
          - "griffe"
          - "griffecli"
          - "griffelib"
      # pydantic pins pydantic-core exactly (pydantic 2.13.5 requires
      # pydantic-core==2.46.5), so a standalone bump of either one is
      # unsatisfiable: the Test job's lock dry-run and the Docker build fail
      # with ResolutionImpossible (#811, #950). pydantic-core used to be
      # ignored, which left pydantic bumps stuck; move them in one PR instead.
      pydantic-stack:
        patterns:
          - "pydantic"
          - "pydantic-core"
      production-dependencies:
        dependency-type: "production"
        patterns:
          - "mcp*"
          - "simplenote*"
      security-dependencies:
        # A group's `update-types` accepts only major/minor/patch; "security"
        # was invalid and silently prevented this group from applying.
        # Security-only grouping is expressed via `applies-to`.
        applies-to: "security-updates"
        dependency-type: "production"
        patterns:
          - "starlette*"
          - "urllib3*"
          - "requests*"
      development-dependencies:
        dependency-type: "development"
        patterns:
          - "ruff*"
          - "mypy*"
          - "pytest*"
          - "black*"
          - "pre-commit*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "docdyhr"

    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # npm (MCP evaluation tooling — devDependencies only, not shipped)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "docdyhr"

    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 3
    assignees:
      - "docdyhr"

    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
