[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    --strict-markers
    --tb=short
    --verbose
    --color=yes
    --cov=simplenote_mcp
    --cov-report=term-missing:skip-covered
    --cov-report=xml
    --cov-report=html
    --cov-fail-under=75
    --timeout=60
    --timeout-method=thread
    --asyncio-mode=auto
    -p no:warnings

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    flaky: marks tests that may fail intermittently
    security: marks security-related tests
    performance: marks performance tests
    perf: marks performance tests (alias)
    timeout: sets a custom timeout for a test
    asyncio: marks async tests

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Timeout configuration
timeout = 60
timeout_method = thread
timeout_func_only = false

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Environment variables for tests (pytest-env). A line overrides the caller's
# environment unless it starts with D:, which sets the value only when it is
# unset. SIMPLENOTE_WRITE_MODE=false holds even in a shell that exports write
# mode (one that loads this clone's .env, say), so the suite runs read-only, as
# CI does; tests that need write mode set it themselves with patch.dict. Offline
# mode is only a default, so an explicit SIMPLENOTE_OFFLINE_MODE=false still runs
# the live integration tests.
env =
    D:SIMPLENOTE_OFFLINE_MODE=true
    SIMPLENOTE_WRITE_MODE=false
    PYTHONDONTWRITEBYTECODE=1
    PYTEST_TIMEOUT=60

# Every pytest key goes above this point: the next [section] header ends
# [pytest], and pytest never reads a key below it. coverage.py doesn't read
# pytest.ini either (it reads setup.cfg), so the two sections below are inert.
[coverage:run]
source = simplenote_mcp
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */migrations/*
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
