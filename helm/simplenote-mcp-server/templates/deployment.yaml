apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "simplenote-mcp-server.fullname" . }}
  labels:
    {{- include "simplenote-mcp-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "simplenote-mcp-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "simplenote-mcp-server.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "simplenote-mcp-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            - name: monitoring
              containerPort: {{ .Values.monitoring.port }}
              protocol: TCP
          env:
            - name: SIMPLENOTE_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "simplenote-mcp-server.secretName" . }}
                  key: SIMPLENOTE_EMAIL
            - name: SIMPLENOTE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "simplenote-mcp-server.secretName" . }}
                  key: SIMPLENOTE_PASSWORD
            - name: MCP_HTTP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "simplenote-mcp-server.secretName" . }}
                  key: MCP_HTTP_AUTH_TOKEN
            - name: HTTP_ENDPOINT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "simplenote-mcp-server.secretName" . }}
                  key: HTTP_ENDPOINT_AUTH_TOKEN
                  # Optional: existing externalSecrets-managed Secrets predate
                  # this key. Without this, upgrading a release whose external
                  # secret store hasn't been given the new key yet would leave
                  # the pod stuck in CreateContainerConfigError — even though
                  # the token itself is only required for a non-loopback
                  # HTTP_HOST override, not the chart's default.
                  optional: true
          envFrom:
            {{- if .Values.configMap.create }}
            - configMapRef:
                name: {{ include "simplenote-mcp-server.fullname" . }}-config
            {{- end }}
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:{{ .Values.monitoring.port }}/health', timeout=5).status == 200 else 1)"
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:{{ .Values.monitoring.port }}/ready', timeout=5).status == 200 else 1)"
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
