# Default values for simplenote-mcp-server
replicaCount: 1

image:
  repository: docdyhr/simplenote-mcp-server
  pullPolicy: IfNotPresent
  tag: "v1.16.1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: simplenote-mcp-server.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  exec:
    command:
      - python
      - -c
      - "import simplenote_mcp.server; print('ok')"
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  exec:
    command:
      - python
      - -c
      - "import simplenote_mcp.server; print('ok')"
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes:
  - name: tmp
    emptyDir: {}
  - name: logs
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: logs
    mountPath: /app/simplenote_mcp/logs

nodeSelector: {}

tolerations: []

affinity: {}

# Simplenote configuration
simplenote:
  # These should be provided via external secrets or environment variables
  email: ""
  password: ""
  syncIntervalSeconds: 120
  logLevel: "INFO"

# External secrets configuration (optional)
externalSecrets:
  enabled: false
  secretStore:
    name: ""
    kind: SecretStore
  target:
    name: simplenote-credentials
    creationPolicy: Owner
  data:
    - secretKey: SIMPLENOTE_EMAIL
      remoteRef:
        key: simplenote-email
    - secretKey: SIMPLENOTE_PASSWORD
      remoteRef:
        key: simplenote-password

# ConfigMap for environment variables
configMap:
  create: true
  data:
    SYNC_INTERVAL_SECONDS: "120"
    LOG_LEVEL: "INFO"
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"
