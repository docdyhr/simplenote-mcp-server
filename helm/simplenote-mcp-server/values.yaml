# Default values for simplenote-mcp-server
replicaCount: 1

image:
  repository: docdyhr/simplenote-mcp-server
  pullPolicy: IfNotPresent
  tag: "v1.18.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

# Separate health/metrics endpoint (ENABLE_HTTP_ENDPOINT below) — not the
# MCP protocol port above. Used by liveness/readiness probes; not exposed
# via the Service, only within the pod.
monitoring:
  port: 8080
  # Bearer token for the health/metrics endpoint — only required if you
  # override HTTP_HOST to non-loopback (the server refuses to start
  # otherwise, see http_endpoints.py's HTTPEndpointsServer.start()). Not
  # needed for the shipped default (HTTP_HOST=127.0.0.1, not exposed via
  # the Service): loopback callers, including the exec probes below, are
  # always trusted regardless of this value. Provide via
  # --set monitoring.authToken=... or a values override; never commit a
  # real token. Stored in the same Secret as the Simplenote credentials.
  authToken: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: simplenote-mcp-server.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 500m
    memory: 256Mi

# Real probes against the monitoring server (ENABLE_HTTP_ENDPOINT=true in
# configMap.data below). `exec`, not `httpGet`: kubelet's httpGet probe
# connects to the Pod IP, but HTTP_HOST is intentionally 127.0.0.1 (the
# monitoring server has no authentication, so it must never be reachable
# from outside the pod's own network namespace — see SECURITY.md). Runs
# from inside the container instead, mirroring docker-compose.yml's
# healthcheck and the Dockerfile's own HEALTHCHECK. Only the timing knobs
# live here — the exec command itself is built in templates/deployment.yaml
# from monitoring.port, since values.yaml isn't templated and a hardcoded
# port string here would silently desync from a monitoring.port override.
livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes:
  - name: tmp
    emptyDir: {}
  - name: logs
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: logs
    mountPath: /app/simplenote_mcp/logs

nodeSelector: {}

tolerations: []

affinity: {}

# Simplenote configuration
simplenote:
  # These should be provided via external secrets or environment variables
  email: ""
  password: ""
  syncIntervalSeconds: 120
  logLevel: "INFO"

# MCP HTTP transport configuration
mcpHttp:
  # Bearer token required for MCP_TRANSPORT=http on a non-loopback bind —
  # server.py's run_http() refuses to start otherwise. Provide via
  # --set mcpHttp.authToken=... or a values override; never commit a real
  # token. Stored in the same Secret as the Simplenote credentials below.
  authToken: ""

# External secrets configuration (optional)
externalSecrets:
  enabled: false
  secretStore:
    name: ""
    kind: SecretStore
  target:
    name: simplenote-credentials
    creationPolicy: Owner
  data:
    - secretKey: SIMPLENOTE_EMAIL
      remoteRef:
        key: simplenote-email
    - secretKey: SIMPLENOTE_PASSWORD
      remoteRef:
        key: simplenote-password
    - secretKey: MCP_HTTP_AUTH_TOKEN
      remoteRef:
        key: mcp-http-auth-token
    - secretKey: HTTP_ENDPOINT_AUTH_TOKEN
      remoteRef:
        key: http-endpoint-auth-token

# ConfigMap for environment variables
configMap:
  create: true
  data:
    SYNC_INTERVAL_SECONDS: "120"
    LOG_LEVEL: "INFO"
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"
    MCP_TRANSPORT: "http"
    MCP_HTTP_HOST: "0.0.0.0"
    ENABLE_HTTP_ENDPOINT: "true"
    HTTP_HOST: "127.0.0.1"
    # HTTP_PORT is set from monitoring.port in templates/configmap.yaml,
    # not here, so the server's actual bind port can never drift from the
    # port the exec probes and containerPort use.
