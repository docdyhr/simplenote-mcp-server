# Default values for simplenote-mcp-server
replicaCount: 1

image:
  repository: docdyhr/simplenote-mcp-server
  pullPolicy: IfNotPresent
  tag: "v1.17.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

# Separate health/metrics endpoint (ENABLE_HTTP_ENDPOINT below) — not the
# MCP protocol port above. Used by liveness/readiness probes; not exposed
# via the Service, only within the pod.
monitoring:
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: simplenote-mcp-server.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 500m
    memory: 256Mi

# Real probes against the monitoring server (ENABLE_HTTP_ENDPOINT=true in
# configMap.data below) — an import-only exec check proves the package is
# installed, not that the process is actually serving requests.
livenessProbe:
  httpGet:
    path: /health
    port: monitoring
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: monitoring
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes:
  - name: tmp
    emptyDir: {}
  - name: logs
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: logs
    mountPath: /app/simplenote_mcp/logs

nodeSelector: {}

tolerations: []

affinity: {}

# Simplenote configuration
simplenote:
  # These should be provided via external secrets or environment variables
  email: ""
  password: ""
  syncIntervalSeconds: 120
  logLevel: "INFO"

# MCP HTTP transport configuration
mcpHttp:
  # Bearer token required for MCP_TRANSPORT=http on a non-loopback bind —
  # server.py's run_http() refuses to start otherwise. Provide via
  # --set mcpHttp.authToken=... or a values override; never commit a real
  # token. Stored in the same Secret as the Simplenote credentials below.
  authToken: ""

# External secrets configuration (optional)
externalSecrets:
  enabled: false
  secretStore:
    name: ""
    kind: SecretStore
  target:
    name: simplenote-credentials
    creationPolicy: Owner
  data:
    - secretKey: SIMPLENOTE_EMAIL
      remoteRef:
        key: simplenote-email
    - secretKey: SIMPLENOTE_PASSWORD
      remoteRef:
        key: simplenote-password
    - secretKey: MCP_HTTP_AUTH_TOKEN
      remoteRef:
        key: mcp-http-auth-token

# ConfigMap for environment variables
configMap:
  create: true
  data:
    SYNC_INTERVAL_SECONDS: "120"
    LOG_LEVEL: "INFO"
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"
    MCP_TRANSPORT: "http"
    MCP_HTTP_HOST: "0.0.0.0"
    ENABLE_HTTP_ENDPOINT: "true"
    HTTP_HOST: "127.0.0.1"
    HTTP_PORT: "8080"
