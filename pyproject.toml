[project]
name = "simplenote-mcp-server"
version = "1.6.0"
description = "A simple MCP Server that connects to Simplenote"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thomas Juul Dyhr", email = "docdyhr@me.com" }]
dependencies = ["mcp[cli]>=1.10.0", "simplenote>=2.1.4", "requests>=2.32.4"]

[project.optional-dependencies]
dev = [
    "ruff==0.12.7",
    "mypy==1.17.1",
    "pre-commit>=3.0.0",
    "black>=23.0.0",
    "bandit[toml]>=1.7.5",
    "tomli>=1.2.0;python_version<'3.11'",
]
test = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.10.0",
    "requests>=2.32.4",
    "tomli>=1.2.0;python_version<'3.11'",
]
monitoring = ["psutil>=5.9.0"]
evals = [
    # Node.js dependencies are managed separately via package.json
    # This is just for documentation and local development setup
]
all = [
    "ruff==0.12.7",
    "mypy==1.17.1",
    "pre-commit>=3.0.0",
    "black>=23.0.0",
    "bandit[toml]>=1.7.5",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.10.0",
    "psutil>=5.9.0",
    "requests>=2.32.4",
    "tomli>=1.2.0;python_version<'3.11'",
]

[project.scripts]
simplenote-mcp-server = "simplenote_mcp.server:run_main"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["simplenote_mcp*"]
exclude = ["tests*", "simplenote_mcp.tests*", "*.tests*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Enhanced rule set that includes:
# E, F: Error/Style (flake8)
# W: Warnings
# I: isort
# B: flake8-bugbear
# C4: flake8-comprehensions
# ARG: flake8-unused-arguments
# SIM: flake8-simplify
# S: flake8-bandit (security)
# ANN: flake8-annotations (type hints)
# UP: pyupgrade
# N: pep8-naming
# D: pydocstyle
select = ["E", "F", "W", "I", "B", "C4", "SIM", "UP"]
ignore = [
    "E203",   # Whitespace before ':' (conflicts with Black)
    "E501",   # Line too long (handled by formatter)
    "E402",   # Module level import not at top of file (needed for dynamic imports)
    "SIM105", # Use contextlib.suppress (sometimes try/except is clearer)
    "SIM102", # Use single if-statement (sometimes nested is clearer)
    "SIM103", # Return condition directly (sometimes explicit is clearer)
    "SIM212", # Simplify conditionals (sometimes explicit is clearer)
    "UP035",  # typing.Type deprecation (compatibility with older Python)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Allow unused imports in __init__.py
"tests/*" = ["S101"] # Allow assert in test files
"simplenote_mcp/tests/*" = [
    "S101",
    "E402",
] # Allow assert and import issues in tests
"**/conftest.py" = ["F401"] # Allow unused imports in conftest
"scripts/*" = ["SIM", "S"] # Relax simplify and security rules for scripts
"simplenote_mcp/scripts/*" = ["SIM", "S"] # Relax rules for internal scripts
"stubs/*" = ["ALL"] # Ignore all rules in type stubs
"test_workflows_locally.py" = ["S602"] # Allow shell=True in local test script

[tool.ruff.lint.isort]
known-first-party = ["simplenote_mcp"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bandit]
exclude_dirs = ["tests", "simplenote_mcp/tests", "simplenote_mcp/scripts"]
skips = [
    "B101", # Skip assert_used test since we use asserts in tests
    "B311", # Skip random usage in non-security contexts (logging examples, test data)
    "B404", # Skip subprocess import warnings (legitimate use in diagnostic scripts)
    "B603", # Skip subprocess without shell warnings for trusted commands
    "B607", # Skip partial path warnings for standard system commands
]
severity = "medium"

[tool.bandit.assert_used]
skips = ["*test*.py", "**/tests/**", "**/test_*.py"]

[tool.bandit.blacklist_calls]
bad_name_sets = [
    "pickle",
    "marshal",
    "shelve",
    "subprocess_popen",
    "subprocess_without_shell_equals_true",
]
